services:

  minio:
    image: quay.io/minio/minio
    container_name: yhct-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123456
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"

  postgres:
    image: postgres:15
    container_name: yhct-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: yhct_db
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./schema/ddl_gold_layer.sql:/docker-entrypoint-initdb.d/init.sql

  qdrant:
    image: qdrant/qdrant
    container_name: yhct-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage